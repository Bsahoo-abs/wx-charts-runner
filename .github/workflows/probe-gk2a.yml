name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with: {repository: "${{ vars.CODE_REPO }}", token: "${{ secrets.CODE_TOKEN }}", ref: demo-live2, path: c}
      - run: |
          mkdir -p /tmp/o && npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx -y playwright@1.47.2 install chromium >/dev/null 2>&1
          cat > s.js <<'J'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path');
          const B="https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/";
          (async()=>{const b=await chromium.launch({args:["--use-gl=angle","--use-angle=swiftshader","--enable-unsafe-swiftshader"]});
          for(const [n,h,mk] of [["v_india","m=ECMWF&type=rain&len=72&area=India%20and%20the%20seas%20around",1],["v_globe","m=GFS&type=rain&len=72&area=Whole%20globe",1],["v_bay_wind","m=ECMWF&type=wind&len=72&area=Bay%20of%20Bengal",0],["v_storm","m=ECMWF&type=rain&len=72&area=WP252026",0]]){
           const c=await b.newContext({viewport:{width:1500,height:900},acceptDownloads:true});
           await c.route(B+"__new/**",async r=>{const rel=new URL(r.request().url()).pathname.replace(/^\/__new\//,''),f=path.join('c/web',rel);if(fs.existsSync(f)&&fs.statSync(f).isFile())return r.fulfill({path:f,contentType:rel.endsWith('.html')?'text/html':rel.endsWith('.json')?'application/json':undefined});const res=await r.fetch({url:B+rel});return r.fulfill({response:res})});
           const p=await c.newPage();p.on('pageerror',e=>console.log(n,'ERR',e.message));await p.goto(B+"__new/videos.html#"+h);await p.waitForTimeout(40000);
           console.log(n,await p.$eval('#stat',e=>e.textContent),'| storms:',await p.$$eval('#storms button',e=>e.map(x=>x.textContent).join(', ')));
           await (await p.$('#out')).screenshot({path:'/tmp/o/'+n+'.png',timeout:120000});
           if(mk){const t0=Date.now();const [dl]=await Promise.all([p.waitForEvent('download',{timeout:1500000}),p.click('#bmake')]);await dl.saveAs('/tmp/o/'+n+'.mp4');console.log(n,'mp4',(Date.now()-t0)/1000,'s')}
           await c.close()}
          await b.close()})();
          J
          node s.js
          cd /tmp/o && git init -q -b probe-out-vid && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-vid
