name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: demo-phase3
          path: code
      - run: |
          cd code/demo && (python3 -m http.server 8813 >/dev/null 2>&1 &) ; sleep 1
          npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx -y playwright@1.47.2 install chromium >/dev/null 2>&1
          cat > s.js <<'J'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();
          for(const [n,h,o] of [["a","m=ECMWF&p=wind&s=6&c=20,86,5",""],["b","m=AIFS&p=rain&s=8&c=15,100,4",""],["c","m=ECMWF&p=wind&s=2&c=15,120,4","sat"],["d","m=ECMWF&p=rain&s=2&c=15,100,4","imerg"],["e","m=ECMWF&p=msl&s=2&c=15,100,4","sst"]]){
           const p=await b.newPage({viewport:{width:1440,height:820}});p.on('pageerror',e=>console.log('ERR',e.message));
           await p.goto("http://localhost:8813/charts_demo.html#"+h);await p.waitForTimeout(9000);
           if(o){await p.evaluate(o=>document.querySelector(`#obs input[data-o="${o}"]`).click(),o);await p.waitForTimeout(9000)}
           await p.screenshot({path:`/tmp/o/${n}.png`});await p.close()}
          await b.close()})();
          J
          mkdir -p /tmp/o && node s.js
          cd /tmp/o && git init -q -b probe-out-ch2 && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-ch2
