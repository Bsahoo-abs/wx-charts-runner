name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir -p o/glob/ecmwf o/tc && cd o
          B=https://test.odisha-wx-charts-glob.pages.dev/ecmwf
          curl -sf $B/xs.json -o glob/ecmwf/xs.json; curl -sf $B/meta.json -o glob/ecmwf/meta.json
          curl -sf https://test.odisha-wx-charts-sat.pages.dev/tc/feed.json -o tc/feed.json || true
          H=$(python3 -c "import json;x=json.load(open('glob/ecmwf/xs.json'));m=json.load(open('glob/ecmwf/meta.json'));hm={s['h'] for s in m['steps']};print(' '.join(str(s['h']) for s in x['steps'] if s['h'] in hm][:16]))" 2>/dev/null || python3 -c "import json;x=json.load(open('glob/ecmwf/xs.json'));print(' '.join(str(s['h']) for s in x['steps'][:16]))")
          echo "hours $H"
          for h in $H; do p=$(printf %03d $h); curl -sf $B/x$p.webp -o glob/ecmwf/x$p.webp; curl -sf $B/f$p.webp -o glob/ecmwf/f$p.webp; done
          du -sh .; ls glob/ecmwf | head -40
          git init -q -b probe-out-3d && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-3d
