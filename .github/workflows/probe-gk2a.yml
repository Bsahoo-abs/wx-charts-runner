name: probe-gk2a
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          G=https://gibs.earthdata.nasa.gov/wmts/epsg3857/best
          curl -s -D - -o /dev/null -H "Origin: https://x.pages.dev" $G/BlueMarble_ShadedRelief_Bathymetry/default/GoogleMapsCompatible_Level8/3/3/5.jpeg | head -20
          curl -s -D - -o /dev/null -H "Origin: https://x.pages.dev" $G/Coastlines_15m/default/GoogleMapsCompatible_Level13/3/3/5.png | grep -i "^http\|access"
