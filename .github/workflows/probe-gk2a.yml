name: probe-gk2a
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {repository: "${{ vars.CODE_REPO }}", token: "${{ secrets.CODE_TOKEN }}", ref: demo-feels, path: code}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install -q numpy scipy pillow eccodes eccodeslib || pip install -q numpy scipy pillow eccodes
      - run: |
          cd code && python - <<'P'
          import cloud_global as g, numpy as np, eccodes
          from datetime import datetime,timezone,timedelta
          t=datetime(2026,11,9,0,tzinfo=timezone.utc)
          recs=g.records(g.get(g.chem_url(t,24)+".idx"));r=next(r for r in recs if ":PMTF:surface:" in r[2] and "Total aerosol" in r[2]);print(r[2])
          b=g.get(g.chem_url(t,24),(r[0],r[1]));h=eccodes.codes_new_from_message(b)
          for k in ["units","name","shortName","Ni","Nj","latitudeOfFirstGridPointInDegrees","longitudeOfFirstGridPointInDegrees","missingValue","bitmapPresent","numberOfValues"]:
              try:print(k,eccodes.codes_get(h,k))
              except Exception as e:print(k,"?",e)
          a=eccodes.codes_get_values(h);print("pct",np.percentile(a,[1,25,50,75,99]),a.max())
          a=g.decode(b)[::2,::2];print(a.shape,np.percentile(a,[1,50,99]))
          # Delhi ~ 28.6N 77.2E on the 0.5 grid rows 90N..
          j=int((90-28.5)/.5);i=int(77/.5);print("delhi",a[j,i]*1e9)
          P
