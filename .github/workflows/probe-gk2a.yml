name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {repository: "${{ vars.CODE_REPO }}", token: "${{ secrets.CODE_TOKEN }}", ref: demo-live2, path: c}
      - run: |
          mkdir -p /tmp/o && cd c && python3 cloud_obs.py /tmp/o && cd /tmp/o && ls -la obs && python3 -c "
          import json;s=json.load(open('obs/stations.json'))['rows'];print(len(s),[r for r in s if r[0] in ('VEBS','VIDP','VABB','VOMM')]);d=json.load(open('obs/dust.json'))['rows'];print(len(d),sum(1 for r in d if 6<r[0]<36 and 68<r[1]<98),'in India')"
          git init -q -b probe-out-obs && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-obs
