name: probe-gk2a
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          curl -s "https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/1.0.0/WMTSCapabilities.xml" > c.xml
          grep -o "<ows:Identifier>[^<]*</ows:Identifier>" c.xml | sed 's/<[^>]*>//g' | grep -iE "imerg|sst|sea_surface|ghrsst|meteosat|msg|seviri|himawari|goes|geo|band13|infrared|clean" | sort -u | head -60
          python3 - <<'P'
          import re
          x=open('c.xml').read()
          for name in ["IMERG_Precipitation_Rate","GHRSST_L4_MUR_Sea_Surface_Temperature","Himawari_AHI_Band13_Clean_Infrared"]:
              i=x.find("<ows:Identifier>"+name+"</ows:Identifier>")
              if i<0: print(name,"missing");continue
              seg=x[i:i+4000]
              print(name, re.findall(r"<TileMatrixSet>([^<]*)</TileMatrixSet>",seg)[:2], re.findall(r'<Format>([^<]*)</Format>',seg)[:1], re.findall(r'<Default>([^<]*)</Default>',seg)[:1], re.findall(r'<Value>([^<]*)</Value>',seg)[-1:])
          P
