name: probe-gk2a
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          python3 - <<'P'
          import json,subprocess,urllib.parse,time
          def g(u):
              r=subprocess.run(["curl","-s","--max-time","20","-A","AbsWxProbe/1.0",u],capture_output=True,text=True);return r.stdout
          Q=["Phulnakhara","Phulnakhra","Phulanakhara","Fulnakhara","Bhatapada","Bhatpada","Gopinathpur","Singhpur","Jatni","Kalarahanga","Kalarahanga village","Gopinathpur Cuttack","Patia","Chandaka","Bhatapada Cuttack","Tangiapada","Bentkar","Aul","Rasulgarh"]
          for q in Q:
              e=urllib.parse.quote(q)
              for extra in ["","&osm_tag=place"]:
                  try:f=json.loads(g(f"https://photon.komoot.io/api/?q={e}&limit=6&lat=20.3&lon=85.8&location_bias_scale=0.3&lang=en{extra}"))["features"]
                  except Exception as x:print(q,extra,"ERR",x);continue
                  print(q,extra or "all","->",[(p["properties"].get("name"),p["properties"].get("osm_value"),p["properties"].get("county") or p["properties"].get("district"),p["properties"].get("state")) for p in f][:5])
          P
