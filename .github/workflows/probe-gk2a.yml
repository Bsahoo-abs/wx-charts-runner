name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir o && cd o
          for c in kol; do curl -s -A "Mozilla/5.0" -o caz_$c.gif https://mausam.imd.gov.in/Radar/caz_$c.gif; curl -s -A "Mozilla/5.0" -o ppi_$c.gif https://mausam.imd.gov.in/Radar/ppi_$c.gif; curl -s -A "Mozilla/5.0" -o sri_$c.gif https://mausam.imd.gov.in/Radar/sri_$c.gif; done
          B=https://test.odisha-wx-charts-radar.pages.dev/radar
          curl -s $B/radar.json -o radar.json
          for t in $(python3 -c "import json;print(' '.join(f['t'] for f in json.load(open('radar.json'))['frames'][-18:]))"); do curl -s $B/z_$t.png -o z_$t.png; done
          ls -la | head; date -u > when.txt
          git init -q -b probe-out-nc && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-nc
