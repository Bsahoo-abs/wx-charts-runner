name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with: {repository: "${{ vars.CODE_REPO }}", token: "${{ secrets.CODE_TOKEN }}", ref: demo-feels, path: code}
      - uses: actions/setup-python@v6
        with: {python-version: "3.11"}
      - run: pip install -q numpy scipy pillow eccodes eccodeslib || pip install -q numpy scipy pillow eccodes
      - name: data sources for fog and air quality
        run: |
          D=$(date -u -d '-1 day' +%Y%m%d)
          echo "== ECMWF open data surface params"; curl -s "https://data.ecmwf.int/forecasts/$D/00z/ifs/0p25/oper/${D}000000-24h-oper-fc.index" | python3 -c "import sys,json;print(sorted({(j.get('levtype'),j['param']) for j in map(json.loads,sys.stdin) if j.get('levtype')=='sfc'}))"
          echo "== GFS visibility / low cloud"; curl -s "https://noaa-gfs-bdp-pds.s3.amazonaws.com/gfs.$D/00/atmos/gfs.t00z.pgrb2.0p50.f024.idx" | grep -E ":VIS:|:LCDC:|:TCDC:low|:DPT:2 m|:RH:2 m" | head
          echo "== GEFS aerosols"; curl -s "https://noaa-gefs-pds.s3.amazonaws.com/?list-type=2&prefix=gefs.$D/00/chem/&delimiter=/" | grep -o "<Prefix>[^<]*" | head; 
          curl -s "https://noaa-gefs-pds.s3.amazonaws.com/?list-type=2&prefix=gefs.$D/00/chem/pgrb2ap25/&max-keys=8" | grep -o "<Key>[^<]*" | head -8
          F=$(curl -s "https://noaa-gefs-pds.s3.amazonaws.com/?list-type=2&prefix=gefs.$D/00/chem/pgrb2ap25/&max-keys=40" | grep -o "<Key>[^<]*idx" | sed 's/<Key>//' | sed -n 5p); echo "idx $F"; curl -s "https://noaa-gefs-pds.s3.amazonaws.com/$F" | head -30
          curl -s "https://noaa-gefs-pds.s3.amazonaws.com/?list-type=2&prefix=gefs.$D/00/chem/pgrb2ap25/&max-keys=1000" | grep -o "<Key>[^<]*" | grep -v idx | tail -3
      - name: short ECMWF globe run with humidity
        run: |
          mkdir pub && cd code && GLOB_MAXH=72 python -c "import cloud_global as g;print(g.ec_model('ECMWF','../pub'))" 2>&1 | tail -5
          cd ../pub && ls ecmwf | head; python3 -c "import json;m=json.load(open('ecmwf/meta.json'));print(m.get('rh2'),len(m['steps']))"
          rm -f ecmwf/x*.webp; git init -q -b probe-out-feels && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-feels
