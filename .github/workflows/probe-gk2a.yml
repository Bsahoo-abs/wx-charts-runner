name: probe-gk2a
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir o && cd o
          for c in gop bhj mum tvm cpj; do curl -s -A "Mozilla/5.0" -o caz_$c.gif https://mausam.imd.gov.in/Radar/caz_$c.gif; done
          curl -s "https://view.eumetsat.int/geoserver/wms?service=WMS&version=1.3.0&request=GetCapabilities" > caps.xml
          python3 - <<'P' > lat.txt
          import re;c=open('caps.xml').read()
          for n in ['msg_iodc:ir108','msg_fes:ir108','mtg_fd:ir105_hrfi','mtg_fd:rgb_truecolour']:
              i=c.find('<Name>'+n+'</Name>');m=re.search(r'<Dimension name="time" default="([^"]+)"',c[i:i+8000]) if i>=0 else None;print(n,m.group(1) if m else None)
          P
          curl -s http://img.nsmc.org.cn/PORTAL/NSMC/XML/FY4B/FY4B_AGRI_IMG_DISK_GCLR_NOM.xml | grep -o 'time="[^"]*"' | tail -3 >> lat.txt
          date -u >> lat.txt; rm caps.xml; ls -la
          git init -q -b probe-out-gop && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-gop
    permissions:
      contents: write
