name: probe-gk2a
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev
          for f in live3d.html live/terr/india.jpg live/terr/sam.png live/dem.png; do echo "$f $(curl -s -o /dev/null -w '%{http_code} %{size_download}' $B/$f)"; done
          curl -s $B/live3d.html | grep -o "Wind particles\|live3d.html\|Terrain" | sort | uniq -c
          curl -s $B/index.html | grep -o 'href="live3d.html"' | head -1
          G=https://test.odisha-wx-charts-glob.pages.dev
          for f in ecmwf/xs_wpac.json gfs/xs_am.json ecmwf/xs.json; do echo "$f $(curl -s -o /dev/null -w '%{http_code}' $G/$f)"; done
