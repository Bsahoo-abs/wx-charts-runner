name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: demo-route
          path: code
      - run: |
          B=https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev
          mkdir site && cd site && cp ../code/web/route.html ../code/web/*.png . 2>/dev/null; curl -sA "Mozilla/5.0 Chrome/130" $B/index.json -o index.json
          python3 - <<'P'
          import json,os,subprocess
          get=lambda u,f:subprocess.run(["curl","-sfA","Mozilla/5.0 (X11; Linux x86_64) Chrome/130","-o",f,u],check=True)
          B="https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/"
          ix=json.load(open("index.json"))
          for m in ix["models"]:
              if m["model"]!="ECMWF":continue
              rs=[r for r in m.get("runs",[]) if r.get("flow")];r=next((x for x in rs if x["flow"]["last"]>=96),rs[0] if rs else None)
              if not r:continue
              d=f"{m['model']}/{r['run']}/flow/";os.makedirs(d,exist_ok=True)
              get(B+d+"meta.json",d+"meta.json");meta=open(d+"meta.json").read()
              for s in json.loads(meta)["steps"][:24]:
                  f=d+"f%03d.webp"%s["h"];get(B+f,f)
              print("got",d)
          P
          (python3 -m http.server 8813 >/dev/null 2>&1 &) ; sleep 1
          npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx -y playwright@1.47.2 install chromium >/dev/null 2>&1
          cat > s.js <<'J'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const ctx=await b.newContext({viewport:{width:1366,height:800},geolocation:{latitude:20.296,longitude:85.824},permissions:['geolocation']});
          const p=await ctx.newPage();p.on('pageerror',e=>console.log('ERR',e.message));
          await p.goto("http://localhost:8813/route.html");await p.waitForTimeout(6000);await p.screenshot({path:'/tmp/o/r1.png'});
          await p.fill('#to','hospital');await p.waitForTimeout(3000);await p.screenshot({path:'/tmp/o/r2.png'});
          const p2=await ctx.newPage();p2.on('pageerror',e=>console.log('ERR',e.message));
          await p2.goto("http://localhost:8813/route.html#from=Bhubaneswar&to=Puri&stops=Pipili|Konark&mode=car");await p2.waitForTimeout(12000);await p2.screenshot({path:'/tmp/o/r3.png'});
          await p2.click('#playtrip');await p2.waitForTimeout(5000);await p2.screenshot({path:'/tmp/o/r4.png'});
          await p2.click('#tlay button[data-k="heat"]');await p2.waitForTimeout(3000);await p2.screenshot({path:'/tmp/o/r5.png'});
          await p2.click('#tend');await p2.mouse.click(900,300,{button:'right'});await p2.waitForTimeout(4000);await p2.screenshot({path:'/tmp/o/r6.png'});
          await b.close()})();
          J
          mkdir -p /tmp/o && node s.js
          cd /tmp/o && git init -q -b probe-out-rt && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-rt
