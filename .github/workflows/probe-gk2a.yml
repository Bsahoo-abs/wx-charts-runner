name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {repository: "${{ vars.CODE_REPO }}", token: "${{ secrets.CODE_TOKEN }}", ref: demo-cycnav, path: c}
      - run: |
          mkdir -p /tmp/o && npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx -y playwright@1.47.2 install chromium >/dev/null 2>&1
          cat > s.js <<'J'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path');const B="https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/";
          (async()=>{const b=await chromium.launch();
          const c=await b.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          await c.route(B+"__new/**",async r=>{const rel=new URL(r.request().url()).pathname.replace(/^\/__new\//,''),f=path.join('c/web',rel);if(fs.existsSync(f)&&fs.statSync(f).isFile()&&rel.endsWith('.html'))return r.fulfill({path:f,contentType:'text/html'});const res=await r.fetch({url:B+rel});return r.fulfill({response:res})});
          const p=await c.newPage();p.on('pageerror',e=>console.log('ERR',e.message));await p.goto(B+"__new/index.html");await p.waitForTimeout(5000);
          await p.click('text=Cyclones');await p.waitForTimeout(3000);
          const btns=await p.$$eval('button',e=>e.filter(x=>x.offsetParent).map(x=>x.textContent.trim().slice(0,40)));console.log('buttons',JSON.stringify(btns.slice(0,30)));
          const pick=await p.$('button:has-text("Tracks by pressure")');if(pick){await pick.click();await p.waitForTimeout(1500)}
          await p.screenshot({path:'/tmp/o/sheet.png'});
          const g=await p.$('text=Cyclone guidance: all models');console.log('guide item',!!g);if(g){await g.click();await p.waitForTimeout(6000);console.log('now at',p.url());await p.screenshot({path:'/tmp/o/guide.png'})}
          await p.goto(B+"__new/lab.html#guide-change");await p.waitForTimeout(6000);await p.screenshot({path:'/tmp/o/change.png'});
          await b.close()})();
          J
          node s.js
          cd /tmp/o && git init -q -b probe-out-cyc && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-cyc
