name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - run: |
          git clone -q --depth 1 https://github.com/tehoro/weather-explorer-web we
          pip install -q eccodes eccodeslib numpy pillow
          cd we && python3 - <<'P'
          import time
          from datetime import datetime, timezone
          from pathlib import Path
          import build3d as B
          B.steps_for = lambda item, run: list(range(0, 73, 3))
          _g = B._get
          def _get2(url, headers=None, timeout=60, attempts=6):
              for k in range(8):
                  try:
                      return _g(url, headers, timeout, attempts)
                  except Exception:
                      if k == 7:
                          raise
                      time.sleep(5 + k * 5)
          B._get = _get2
          C=[["Chennai",80.27,13.08],["Visakhapatnam",83.22,17.69],["Bhubaneswar",85.82,20.3],["Kolkata",88.36,22.57],["Puri",85.83,19.81],["Berhampur",84.79,19.31],["Nellore",79.99,14.44],["Vijayawada",80.65,16.51],["Hyderabad",78.49,17.39],["Bengaluru",77.59,12.97],["Colombo",79.86,6.93],["Port Blair",92.73,11.62],["Yangon",96.1,16.84],["Kakinada",82.24,16.99],["Gopalpur",84.9,19.26],["Paradip",86.65,20.26]]
          bb=[76.0,6.0,96.0,22.5]
          item={"id":"murasu","title":"Cyclone Murasu, Bay of Bengal","where":{"bbox":bb,"label":"Bay of Bengal"},"scenes":[{"bbox":bb,"focus":[{"label":n,"lon":lo,"lat":la} for n,lo,la in C]}]}
          out=Path("../o/3d/murasu-2026110100");out.parent.mkdir(parents=True,exist_ok=True)
          B.build_one(item, datetime(2026,11,1,tzinfo=timezone.utc), out)
          P
          cd ../o && ls -laR | head
          git init -q -b probe-out-we3d && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-we3d
