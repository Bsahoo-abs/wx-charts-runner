name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - run: |
          git clone -q --depth 1 https://github.com/tehoro/weather-explorer-web we
          pip install -q eccodes eccodeslib numpy
          cd we && python3 - <<'P'
          import time, numpy as np
          from datetime import datetime, timezone
          import build3d as B
          bb=[76.0,6.0,96.0,22.5];res=.25
          box={"lons":np.arange(bb[0],bb[2]+1e-6,res),"lats":np.arange(bb[1],bb[3]+1e-6,res)}
          run=datetime(2026,11,1,tzinfo=timezone.utc);out={}
          for s in range(3,73,3):
              for k in range(8):
                  try:
                      out[f"t{s:03d}"]=B.field(run,s,"2t",None,box)-273.15;break
                  except Exception:
                      time.sleep(5+5*k)
          np.savez_compressed("../t2m.npz",**out);print(len(out),"steps")
          P
          mkdir -p ../o && mv ../t2m.npz ../o/ && cd ../o && git init -q -b probe-out-t2m && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-t2m
