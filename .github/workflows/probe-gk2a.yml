name: probe-gk2a
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          R=https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com
          for k in 20261101/00z/ifs/0p25/oper/20261101000000-0h-oper-fc.index 20261101/00z/ifs/0p25/oper/20261101000000-24h-oper-fc.index 20261102/12z/ifs/0p25/oper/20261102120000-24h-oper-fc.index; do echo "== $k"; curl -s -D - -o body.txt "$R/$k" | head -3; head -c 300 body.txt; echo; done
          curl -s "$R/?list-type=2&prefix=20261101/00z/ifs/0p25/oper/20261101000000-0h&max-keys=4" | grep -o '<Key>[^<]*</Key><LastModified>[^<]*</LastModified>[^S]*<StorageClass>[^<]*' | head
