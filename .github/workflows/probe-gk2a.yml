name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with: {repository: "${{ vars.CODE_REPO }}", token: "${{ secrets.CODE_TOKEN }}", ref: demo-live2, path: c}
      - run: |
          mkdir -p /tmp/o && npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx -y playwright@1.47.2 install chromium >/dev/null 2>&1
          cat > s.js <<'J'
          const {chromium}=require('playwright'),fs=require('fs'),path=require('path');
          const B="https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/";
          (async()=>{const b=await chromium.launch({args:["--use-gl=angle","--use-angle=swiftshader","--enable-unsafe-swiftshader"]});
          {const c=await b.newContext();await c.route(B+"__new/**",async r=>{const rel=new URL(r.request().url()).pathname.replace(/^\/__new\//,''),f=path.join('c/web',rel);if(fs.existsSync(f)&&fs.statSync(f).isFile())return r.fulfill({path:f,contentType:rel.endsWith('.html')?'text/html':rel.endsWith('.json')?'application/json':undefined});const res=await r.fetch({url:B+rel});return r.fulfill({response:res})});
           const p=await c.newPage();p.on('console',m=>console.log('c',m.type(),m.text().slice(0,200)));p.on('pageerror',e=>console.log('ERR',e.message));await p.goto(B+"__new/videos.html#area=Bay%20of%20Bengal");await p.waitForTimeout(30000);
           console.log(await p.evaluate(async()=>{const u="https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_NextGeneration/default/GoogleMapsCompatible_Level8/3/3/5.jpeg";const r=await fetch(u);const u2="https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/BlueMarble_ShadedRelief/default/GoogleMapsCompatible_Level8/3/3/5.jpeg";const r2=await fetch(u2);
            const l=await fetch("live/land.json").then(r=>r.status);return JSON.stringify({bm:r.status,cors:r.headers.get("access-control-allow-origin"),type:r.headers.get("content-type"),sr:r2.status,land:l})}));
           await c.close()}
          await b.close()})();
          J
          node s.js
          cd /tmp/o && git init -q -b probe-out-vid && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-vid
