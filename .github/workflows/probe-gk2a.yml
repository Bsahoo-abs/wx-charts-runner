name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir -p /tmp/o && cd /tmp/o; B=https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev; U="Mozilla/5.0 Chrome/130"
          curl -sfA "$U" $B/index.json -o index.json
          R=$(python3 -c "import json;m=[x for x in json.load(open('index.json'))['models'] if x['model']=='ECMWF'][0];print(m['runs'][0]['run'])")
          for c in precip6 wind10 gust10; do curl -sfA "$U" "$B/ECMWF/$R/$c/f048.png" -o ${c}_048.png; done; curl -sfA "$U" $B/logo-am-wide.png -o logo.png; ls -la
          git init -q -b probe-out-ui && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-ui
