name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir -p /tmp/o && cd /tmp && npm i -s playwright@1.47.2 >/dev/null 2>&1 && npx -y playwright@1.47.2 install chromium >/dev/null 2>&1
          cat > s.js <<'J'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({args:["--use-gl=angle","--use-angle=swiftshader","--enable-unsafe-swiftshader"]});
          const B="https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/live3d.html";
          for(const [n,vp,mob] of [["m1",{width:390,height:844},true],["m2",{width:360,height:740},true],["d1",{width:1440,height:860},false]]){
           const c=await b.newContext({viewport:vp,isMobile:mob,hasTouch:mob,deviceScaleFactor:mob?2:1});const p=await c.newPage();p.on('pageerror',e=>console.log(n,'ERR',e.message));
           await p.goto(B+"#area=bay");await p.waitForTimeout(25000);await p.screenshot({path:'/tmp/o/'+n+'.png'});await c.close()}
          await b.close()})();
          J
          node s.js
          cd /tmp/o && git init -q -b probe-out-3d && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-3d
