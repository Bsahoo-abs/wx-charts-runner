name: probe-gk2a
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir -p /tmp/o && cd /tmp/o
          B=https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev; U="Mozilla/5.0 Chrome/130"
          curl -sfA "$U" $B/index.json -o index.json; curl -sfA "$U" $B/guide/guide.json -o guide.json; for f in tracks_bob intensity_bob cycle_bob enstracks_bob; do curl -sfA "$U" $B/guide/$f.png -o $f.png; done; python3 -c "import json;print(json.load(open('index.json'))['models'][0]['runs'][0].get('charts',{}).keys())" || true
          python3 - <<'P'
          import json,subprocess,os
          B="https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/";ix=json.load(open("index.json"))
          for m in ix["models"]:
              for r in m["runs"][:3]:
                  d=f"{m['model']}/{r['run']}";os.makedirs(d,exist_ok=True)
                  for f in ["tracks.json","run.json"]:
                      subprocess.run(["curl","-sfA","Mozilla/5.0 Chrome/130","-o",f"{d}/{f}",B+d+"/"+f])
          for m in ix.get("ens",[]):
              for r in m["runs"][:2]:
                  d=f"ens/{m['model']}/{r['run']}";os.makedirs(d,exist_ok=True)
                  for f in ["tracks.csv","ens.json"]:
                      subprocess.run(["curl","-sfA","Mozilla/5.0 Chrome/130","-o",f"{d}/{f}",B+d+"/"+f])
          P
          find . -name "*.json" -size -2 -delete; ls -R | head -80
          git init -q -b probe-out-trk && git add -A && git -c user.name=p -c user.email=p@x commit -qm o && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-trk
