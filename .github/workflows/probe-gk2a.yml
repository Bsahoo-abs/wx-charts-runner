name: probe-gk2a
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          for d in 20261101 20261102 20261103; do for root in https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com https://data.ecmwf.int/forecasts; do
            c=$(curl -s -o /dev/null -w "%{http_code}" "$root/$d/00z/ifs/0p25/oper/${d}000000-24h-oper-fc.index"); echo "$d $root $c"; done; done
          curl -s "https://ecmwf-forecasts.s3.eu-central-1.amazonaws.com/?list-type=2&prefix=20261101/00z/ifs/0p25/oper/&max-keys=5" | head -c 600
