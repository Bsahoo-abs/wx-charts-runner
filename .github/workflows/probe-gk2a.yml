name: probe-gk2a
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          B=https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev; G=https://test.odisha-wx-charts-glob.pages.dev; U="Mozilla/5.0 Chrome/130"
          echo "route new search: $(curl -sA "$U" $B/route.html | grep -c 'Search more')"; echo "3D home button: $(curl -sA "$U" $B/live3d.html | grep -c 'id=\"home\"')"
          echo "3D new ground: $(curl -sA "$U" -o /dev/null -w '%{http_code} %{size_download}' $B/live/terr/scs.png)"
          for m in ecmwf gfs; do echo "globe $m: $(curl -sA "$U" $G/$m/meta.json | head -c 120)"; done
          echo "globe parts: $(curl -sA "$U" $G/keep-parts.json | python3 -c 'import sys,json;print({k:len(v) for k,v in json.load(sys.stdin)["parts"].items()})')"
          echo "test parts: $(curl -sA "$U" $B/keep-parts.json | python3 -c 'import sys,json;print(sorted(json.load(sys.stdin)["parts"]))')"
