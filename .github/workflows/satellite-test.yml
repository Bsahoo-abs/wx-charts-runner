# Satellite pictures (EUMETSAT Meteosat-9 Indian Ocean) every 15 minutes, then publish.
name: satellite-test

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    paths: [".github/workflows/satellite-test.yml"]
  workflow_dispatch:

concurrency:
  group: satellite-test
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sat:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - uses: actions/cache/restore@v4
        with:
          path: site/sat
          key: satt-IODC-none
          restore-keys: satt-IODC-
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Satellite pictures
        run: |
          pip install -q numpy pillow cartopy "shapely>=2"
          python code/cloud_sat.py site
      - name: Sample pictures for checking (test only)
        if: github.event_name == 'push' && contains('satellite-test', 'test')
        run: |
          mkdir -p sample && cp site/sat/base.webp sample/ && for k in visible clouds ir wv; do f=$(ls site/sat/$k/*.webp | tail -1); cp "$f" sample/$k.webp; done
          cd sample && git init -q -b probe-out-satimg && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm sample
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-satimg
      - uses: actions/cache/save@v4
        with:
          path: site/sat
          key: satt-IODC-${{ github.run_id }}
      - name: Delete older saved sets
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: satt-IODC-${{ github.run_id }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "satt-IODC-" --limit 100 --json key -q '.[].key' |
            while read -r k; do [ "$k" != "$NEW" ] && gh cache delete -R "$GITHUB_REPOSITORY" "$k" || true; done

  publish:
    needs: sat
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: publish-test
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - { name: 'ptest ECMWF', uses: actions/cache/restore@v4,
          with: { path: site/ECMWF, key: ptest-ECMWF-none, restore-keys: ptest-ECMWF- } }
      - { name: 'ptest AIFS', uses: actions/cache/restore@v4,
          with: { path: site/AIFS, key: ptest-AIFS-none, restore-keys: ptest-AIFS- } }
      - { name: 'ptest GFS', uses: actions/cache/restore@v4,
          with: { path: site/GFS, key: ptest-GFS-none, restore-keys: ptest-GFS- } }
      - { name: 'ptest AIGFS', uses: actions/cache/restore@v4,
          with: { path: site/AIGFS, key: ptest-AIGFS-none, restore-keys: ptest-AIGFS- } }
      - { name: 'ptest ICON', uses: actions/cache/restore@v4,
          with: { path: site/ICON, key: ptest-ICON-none, restore-keys: ptest-ICON- } }
      - { name: 'ptest GEM', uses: actions/cache/restore@v4,
          with: { path: site/GEM, key: ptest-GEM-none, restore-keys: ptest-GEM- } }
      - { name: 'vid ECMWF', uses: actions/cache/restore@v4,
          with: { path: site/vid/ECMWF, key: vid-ECMWF-none, restore-keys: vid-ECMWF- } }
      - { name: 'vid AIFS', uses: actions/cache/restore@v4,
          with: { path: site/vid/AIFS, key: vid-AIFS-none, restore-keys: vid-AIFS- } }
      - { name: 'vid GFS', uses: actions/cache/restore@v4,
          with: { path: site/vid/GFS, key: vid-GFS-none, restore-keys: vid-GFS- } }
      - { name: 'vid AIGFS', uses: actions/cache/restore@v4,
          with: { path: site/vid/AIGFS, key: vid-AIGFS-none, restore-keys: vid-AIGFS- } }
      - { name: 'vid ICON', uses: actions/cache/restore@v4,
          with: { path: site/vid/ICON, key: vid-ICON-none, restore-keys: vid-ICON- } }
      - { name: 'vid GEM', uses: actions/cache/restore@v4,
          with: { path: site/vid/GEM, key: vid-GEM-none, restore-keys: vid-GEM- } }
      - { name: 'ens ECMWF_ENS', uses: actions/cache/restore@v4,
          with: { path: site/ens/ECMWF_ENS, key: ens-ECMWF_ENS-none, restore-keys: ens-ECMWF_ENS- } }
      - { name: 'ens AIFS_ENS', uses: actions/cache/restore@v4,
          with: { path: site/ens/AIFS_ENS, key: ens-AIFS_ENS-none, restore-keys: ens-AIFS_ENS- } }
      - { name: 'ens GEFS', uses: actions/cache/restore@v4,
          with: { path: site/ens/GEFS, key: ens-GEFS-none, restore-keys: ens-GEFS- } }
      - { name: 'ens AIGEFS', uses: actions/cache/restore@v4,
          with: { path: site/ens/AIGEFS, key: ens-AIGEFS-none, restore-keys: ens-AIGEFS- } }
      - { name: 'satt IODC', uses: actions/cache/restore@v4,
          with: { path: site/sat, key: satt-IODC-none, restore-keys: satt-IODC- } }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1
      - name: Model guidance
        continue-on-error: true
        env:
          MPLBACKEND: Agg
        run: |
          pip install -q numpy matplotlib cartopy "shapely>=2" reportlab pillow
          python code/cloud_guidance.py site
      - name: Build the website
        run: python3 code/site_build.py site
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT }}
        run: npx --yes wrangler@3 pages deploy site --project-name "$PROJECT" --branch test --commit-dirty=true
