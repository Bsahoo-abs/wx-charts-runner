# TEST: watcher - starts a build for each model with new data (test copy of the site only)
name: watch-test

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths: [".github/workflows/watch-test.yml"]
  workflow_dispatch:

concurrency:
  group: watch-test
  cancel-in-progress: true          # a newer watcher takes over

permissions:
  contents: read
  actions: write                    # to start build-test

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install
        run: pip install -q -r code/requirements.txt
      - name: Watch the data servers (every 2 minutes, 30 minutes long)
        env:
          MPLBACKEND: Agg
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd code
          python cloud_plan.py --site-url "https://test.${{ vars.PAGES_PROJECT }}.pages.dev" \
            --models ECMWF,AIFS,GFS,AIGFS,ICON,GEM --watch 30 --dispatch build-test.yml
