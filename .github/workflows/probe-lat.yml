# One-off: full-quality 'Follow the storm - Bay of Bengal' videos for download (not published). -> branches probe-out-vid-<model>
name: probe-lat
on:
  push:
    paths: [".github/workflows/probe-lat.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  hq:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        model: [ECMWF, AIFS, GFS, AIGFS, ICON, GEM]
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Make the video
        env:
          MPLBACKEND: Agg
        run: |
          pip install -q -r code/requirements.txt
          cd code && python tools/hq_video.py --model ${{ matrix.model }} --work ../work --out ../out 2>&1 | tail -20 | tee ../out.log
      - if: always()
        run: |
          mkdir -p out && cp out.log out/ || true
          cd out && git init -q -b probe-out-vid-${{ matrix.model }} && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm vid
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-vid-${{ matrix.model }}
