name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev
          mkdir o; cd o
          curl -s "$U/index.json?x=$RANDOM" | python3 -c "import json,sys;j=json.load(sys.stdin);print(j['built']);[print(m['model'],[(r['run'],r.get('flow')) for r in m['runs']]) for m in j['models']]" > out.txt
          curl -s "$U/sat/sat.json?x=$RANDOM" | python3 -c "import json,sys;j=json.load(sys.stdin);f=j.get('flow');print('satflow',f and (f['size'],len(f['pairs'])))" >> out.txt
          curl -sI "$U/livemap.html" | head -1 >> out.txt; curl -sI "$U/live/lines.json" | head -1 >> out.txt
          git init -q; git checkout -q -b probe-out-live; git add out.txt; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-live
