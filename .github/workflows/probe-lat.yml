name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e; mkdir o; cd o; npm init -y >/dev/null; npm i playwright@1.48.2 >/dev/null 2>&1; npx playwright install chromium >/dev/null 2>&1
          curl -s -A Mozilla/5.0 https://test.odisha-wx-charts.pages.dev/sat/sat.json | python3 -c "import json,sys;j=json.load(sys.stdin);print({k:len(v['frames']) for k,v in j['products'].items()})" > sat.txt
          for u in https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev https://test.odisha-wx-charts.pages.dev; do echo $u; curl -sL -A Mozilla/5.0 $u/livemap.html | grep -o 'go3d\|6a73c4\|4b4fa6' | sort | uniq -c; curl -sL -A Mozilla/5.0 $u/live3d.html | head -c 300; done > chk.txt
          cat > s.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({args:['--use-gl=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});const p=await b.newPage({viewport:{width:1440,height:900}});
          p.on('pageerror',e=>console.log('ERR',e.message));
          const B="https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/";
          await p.goto(B+"livemap.html#layer=wind",{timeout:60000});await p.waitForTimeout(14000);await p.screenshot({path:'wind.png'});await p.goto(B+'livemap.html#layer=gust',{timeout:60000});await p.waitForTimeout(12000);await p.screenshot({path:'gust.png'});
          await p.goto(B+"live3d#layer=wind",{timeout:60000});await p.waitForTimeout(20000);await p.screenshot({path:'w3d.png'});
          await p.goto(B+"live3d#layer=rain",{timeout:60000});await p.waitForTimeout(20000);await p.screenshot({path:'r3d.png'});
          await b.close()})();
          JS
          node s.js > log.txt 2>&1
          git init -q; git checkout -q -b probe-out-shot4; git add *.png *.txt; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-shot4
