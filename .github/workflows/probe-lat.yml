# One-off TEST: is the radar page reachable? Results -> branch probe-out-lat.
name: probe-lat
on:
  push:
    paths: [".github/workflows/probe-lat.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check
        run: |
          mkdir -p out
          for c in cni shr plk kol chn; do curl -s -A "Mozilla/5.0" -D out/h_$c.txt -o out/caz_$c.gif "https://mausam.imd.gov.in/Radar/caz_$c.gif"; echo "$c $(head -1 out/h_$c.txt) $(stat -c %s out/caz_$c.gif)" >> out/log.txt; done
          curl -s -A "Mozilla/5.0" "https://radar.bmd.gov.bd/radar-images-dhaka.json" | head -c 600 >> out/log.txt; echo >> out/log.txt
      - name: Save
        if: always()
        run: |
          cd out && git init -q -b probe-out-lat && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm lat
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-lat
