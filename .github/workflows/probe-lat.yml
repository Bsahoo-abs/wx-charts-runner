name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e; mkdir o; cd o; npm init -y >/dev/null; npm i playwright@1.48.2 >/dev/null 2>&1; npx playwright install chromium >/dev/null 2>&1
          curl -s -A Mozilla/5.0 https://test.odisha-wx-charts-glob.pages.dev/gfs/xs.json | head -c 300 > xs.txt
          curl -sL -A Mozilla/5.0 https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/index.json | python3 -c "
          import json,sys;j=json.load(sys.stdin)
          for m in j['models']:
            for r in m['runs'][:2]: print(m['model'],r['run'],{k:len(v.get('hours',[])) for k,v in r['charts'].items() if 'wind' in k or 'gust' in k})" > idx.txt
          git init -q; git checkout -q -b probe-out-idx; git add *.txt; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-idx
