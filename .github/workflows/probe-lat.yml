name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e; mkdir o; cd o; npm init -y >/dev/null; npm i playwright@1.48.2 >/dev/null 2>&1; npx playwright install chromium >/dev/null 2>&1
          curl -s -A Mozilla/5.0 https://test.odisha-wx-charts-glob.pages.dev/gfs/xs.json | head -c 300 > xs.txt
          cat > s.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({args:['--use-gl=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});const p=await b.newPage({viewport:{width:1440,height:900}});
          p.on('pageerror',e=>console.log('ERR',e.message));
          const B="https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/";
          await p.goto(B+"#ECMWF9",{timeout:60000});await p.waitForTimeout(6000);await p.screenshot({path:'index.png'});
          try{await p.click('.item:has-text("10 m wind")',{timeout:4000});await p.waitForTimeout(5000);await p.screenshot({path:'wind_chart.png'})}catch(e){console.log('no wind chart',e.message)}
          await p.goto(B+"livemap.html#layer=wind&model=GFS",{timeout:60000});await p.waitForTimeout(14000);
          await p.click('#t',{position:{x:5,y:5}}).catch(()=>{});await p.screenshot({path:'wind.png'});
          await p.click('#secbtn');await p.waitForTimeout(600);await p.mouse.click(760,330);await p.waitForTimeout(500);await p.mouse.click(1150,420);await p.waitForTimeout(6000);
          await p.screenshot({path:'section.png'});
          await b.close()})();
          JS
          node s.js > log.txt 2>&1
          git init -q; git checkout -q -b probe-out-shot5; git add *.png *.txt; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-shot5
