name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: dev-sat
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q numpy scipy pillow cartopy "shapely>=2" "satpy[ami_l1b]" pyresample netCDF4 h5netcdf dask opencv-python-headless pdfplumber
      - run: |
          set +e; mkdir pub; cd code
          python cloud_tcfeed.py ../pub https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev > ../pub/tc.log 2>&1
          /usr/bin/time -v python cloud_sat2.py ../pub 1500 > ../pub/log.txt 2> ../pub/time.txt
          tail -5 ../pub/log.txt; grep -i "maximum resident" ../pub/time.txt
          cd ../pub; rm -rf sat2/ir
          git init -q; git checkout -q -b probe-out-sat3; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-sat3
