name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir o; cd o; pip install -q pdfplumber
          g(){ curl -sL -A "Mozilla/5.0" -m 60 -o "$1" "$2"; echo "$1 $?" >> out.txt; }
          g rsmc.html https://rsmcnewdelhi.imd.gov.in/
          for k in TC_ADVISORY QUADRANT National_Bulletin TCFP Tropical_Weather_Outlook; do a=$(grep -oE "uploads/archive/[^\"]*${k}[^\"]*\.pdf" rsmc.html | head -1); g "$k.pdf" "https://rsmcnewdelhi.imd.gov.in/$a"; done
          python3 -c "
          import pdfplumber,glob
          for f in glob.glob('*.pdf'):
              try:
                  with pdfplumber.open(f) as p: open(f[:-4]+'.txt','w').write('\n=====PAGE\n'.join((pg.extract_text() or '') for pg in p.pages[:4]))
              except Exception as e: print(f,e)
          "
          U=https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev
          curl -s "$U/index.json" -o index.json
          python3 -c "
          import json,urllib.request
          j=json.load(open('index.json'))
          for m in j['models']:
              r=m['runs'][0]['run']
              try:
                  d=urllib.request.urlopen('$U/%s/%s/tracks.json'%(m['model'],r)).read(); open('tracks_%s.json'%m['model'],'wb').write(d)
              except Exception as e: print(m['model'],e)
          "
          g bio99.dat http://hurricanes.ral.ucar.edu/repository/data/bdecks_open/2026/bio992026.dat
          g aio99.dat http://hurricanes.ral.ucar.edu/repository/data/adecks_open/aio992026.dat
          g io99web.txt https://www.metoc.navy.mil/jtwc/products/io9926web.txt
          rm -f *.pdf rsmc.html index.json
          git init -q; git checkout -q -b probe-out-tc3; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-tc3
