name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e; mkdir o; cd o
          python3 - <<'PY' > fy.txt 2>&1
          import json,urllib.request
          op=urllib.request.build_opener();op.addheaders=[("User-Agent","Mozilla/5.0")];urllib.request.install_opener(op)
          for q in ["FY-4B","FY4B","AGRI","fengyun"]:
            for base in ["https://wis2-gdc.weather.gc.ca","https://gdc.wis.cma.cn"]:
              try:
                j=json.load(urllib.request.urlopen(f"{base}/collections/wis2-discovery-metadata/items?q={q}&limit=30&f=json",timeout=60))
                print("==",base,q,j.get("numberMatched"))
                for f in j.get("features",[]):
                  p=f.get("properties",{});print(" -",f.get("id"),"|",p.get("title"),"|",(p.get("wmo:dataPolicy") or ""))
                  for l in f.get("links",[])[:8]:
                    if l.get("channel") or "mqtt" in l.get("href","") or l.get("rel") in ("data","items","archives"): print("     ",l.get("rel"),l.get("channel"),l.get("href"))
              except Exception as e: print("ERR",base,q,e)
          PY
          for u in "https://gsics.nsmc.org.cn/thredds/catalog.html" "http://satellite.nsmc.org.cn/DataPortal/en/home/index.html"; do echo "$u $(curl -s -m 30 -o /dev/null -w '%{http_code}' $u)" >> fy.txt; done
          git init -q; git checkout -q -b probe-out-fy; git add *.txt; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-fy
