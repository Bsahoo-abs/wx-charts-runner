name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
          set +e; mkdir o; cd o
          A=https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID
          H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          echo "token verify: $(curl -s -H "$H" https://api.cloudflare.com/client/v4/user/tokens/verify | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("success"),d.get("result",{}).get("status"))')" > out.txt
          echo "pages list: $(curl -s -H "$H" "$A/pages/projects" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("success"),[p["name"] for p in d.get("result") or []],d.get("errors"))')" >> out.txt
          echo "kv list: $(curl -s -H "$H" "$A/storage/kv/namespaces" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("success"),[n["title"] for n in d.get("result") or []],d.get("errors"))')" >> out.txt
          echo "kv create: $(curl -s -X POST -H "$H" -H 'Content-Type: application/json' -d '{"title":"ow-trackmaker"}' "$A/storage/kv/namespaces" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("success"),(d.get("result") or {}).get("id"),d.get("errors"))')" >> out.txt
          echo "pages create: $(curl -s -X POST -H "$H" -H 'Content-Type: application/json' -d "{\"name\":\"$PROJECT-sat\",\"production_branch\":\"main\"}" "$A/pages/projects" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("success"),d.get("errors"))')" >> out.txt
          git init -q; git checkout -q -b probe-out-cf; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-cf
