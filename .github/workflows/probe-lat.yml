name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e; mkdir o; cd o; npm i -s playwright@1.48.2 >/dev/null 2>&1; npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > s.js <<'J'
          const {chromium}=require('playwright');(async()=>{
          const b=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--ignore-gpu-blocklist']});
          const S='https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev';
          const p=await b.newPage({viewport:{width:1280,height:760}});p.on('pageerror',e=>console.log('ERR',e.message));
          await p.goto(S+'/route.html#from=Konark&to=Gop&go=1');await p.waitForTimeout(15000);await p.screenshot({path:'route.jpg',quality:80});
          await p.selectOption('#stay','120');await p.waitForTimeout(8000);await p.evaluate(()=>document.getElementById('pan').scrollTop=520);await p.screenshot({path:'route2.jpg',quality:80});
          const q=await b.newPage({viewport:{width:1280,height:760}});q.on('pageerror',e=>console.log('ERR3d',e.message));
          await q.goto(S+'/live3d.html#model=ECMWF&area=storm');await q.waitForTimeout(30000);await q.screenshot({path:'live3d.jpg',quality:80});
          await q.click('#lvl button:nth-child(3)');await q.waitForTimeout(8000);await q.screenshot({path:'live3d_850.jpg',quality:80});
          await b.close()})();
          J
          node s.js > log.txt 2>&1; rm -rf node_modules package*.json s.js
          git init -q; git checkout -q -b probe-out-c5; git add -A; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-c5
