name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir o; cd o
          S=https://test.odisha-wx-charts-sat.pages.dev
          T=https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev
          { date -u
            echo "sat.json: $(curl -s $S/sat2/sat.json | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["frames"][-3:],len(d["frames"]),d["made"])')"
            echo "feed: $(curl -s $S/tc/feed.json | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d["made"],[(s["id"],s.get("name"),len(s["sources"])) for s in d["storms"]],d.get("errors"))')"
            echo "api/ow: $(curl -s -w ' %{http_code}' $S/api/ow)"
            echo "cors: $(curl -sI $S/sat2/sat.json | grep -i access-control)"
            echo "livemap: $(curl -s $T/livemap | grep -c SATB) trackmaker: $(curl -s -o /dev/null -w '%{http_code}' $T/trackmaker)"
          } > out.txt
          git init -q; git checkout -q -b probe-out-chk; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-chk
