# One-off: demo data (GFS textures; smooth satellite loop). Not published. -> branches probe-out-gfs, probe-out-satflow
name: probe-lat
on:
  push:
    paths: [".github/workflows/probe-lat.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with: { repository: "${{ vars.CODE_REPO }}", token: "${{ secrets.CODE_TOKEN }}", ref: test, path: code }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: |
          pip install -q numpy pillow eccodes scipy
          python code/tools/demo_gfs.py out 2026102500 2>&1 | tail -30 | tee log.txt; cp log.txt out/ || true
      - if: always()
        run: |
          mkdir -p out && cd out && git init -q -b probe-out-gfs && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm gfs
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-gfs
