name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: dev-sat
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q numpy pillow cartopy "shapely>=2" netCDF4
      - run: |
          set +e; mkdir o; cd code
          python tools/sc99_data.py ../o 76 128 2 28 > ../o/log.txt 2>&1
          tail -5 ../o/log.txt
          cd ../o
          git init -q; git checkout -q -b probe-out-sc99d; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-sc99d
