name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e; mkdir o; cd o; date -u > chk.txt
          S=https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev
          curl -sL -A Mozilla/5.0 $S/livemap.html | grep -o 'id="go3d"\|wsat/world' | sort | uniq -c >> chk.txt
          curl -sL -A Mozilla/5.0 -o /dev/null -w 'live3d %{http_code} %{size_download}\n' $S/live3d.html >> chk.txt
          curl -s -A Mozilla/5.0 https://test.odisha-wx-charts-glob.pages.dev/wsat/wsat.json >> chk.txt; echo >> chk.txt
          for m in ecmwf aifs; do curl -s -A Mozilla/5.0 https://test.odisha-wx-charts-glob.pages.dev/$m/xs.json | head -c 100 >> chk.txt; echo >> chk.txt; done
          git init -q; git checkout -q -b probe-out-c3; git add -A; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-c3
