name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: dev-tc
          path: code
      - run: |
          set +e; mkdir o; cd o; pip install -q pdfplumber
          python3 ../code/cloud_tcfeed.py . https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev > log.txt 2>&1
          git init -q; git checkout -q -b probe-out-tc4; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-tc4
