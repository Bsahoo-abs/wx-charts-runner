name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: dev-sat
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -q numpy scipy pillow cartopy "shapely>=2" "satpy[ami_l1b]" pyspectral pyresample netCDF4 h5netcdf dask opencv-python-headless
      - run: |
          set +e; mkdir o; cd o
          python ../code/tools/demo_sat2.py . 2.2 > log.txt 2>&1
          tail -40 log.txt
          git init -q; git checkout -q -b probe-out-sat2; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-sat2
