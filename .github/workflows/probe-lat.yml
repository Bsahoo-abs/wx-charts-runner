# One-off: remove the test video copies (they pushed the test site's saved data out of GitHub's 10 GB store).
name: probe-lat
on:
  push:
    paths: [".github/workflows/probe-lat.yml"]
  workflow_dispatch:
permissions:
  actions: write
jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "vidt-" --limit 50 --json key -q '.[].key' | while read -r k; do gh cache delete -R "$GITHUB_REPOSITORY" "$k"; done
