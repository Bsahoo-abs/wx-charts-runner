name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e; mkdir o; cd o; pip install -q numpy pillow >/dev/null 2>&1
          python3 - <<'PY' > radar.txt 2>&1
          import json,urllib.request,io,numpy as np
          from PIL import Image
          op=urllib.request.build_opener();op.addheaders=[("User-Agent","Mozilla/5.0")];urllib.request.install_opener(op)
          B="https://test.odisha-wx-charts-radar.pages.dev/radar/"
          j=json.load(urllib.request.urlopen(B+"radar.json"))
          print({k:(v if not isinstance(v,list) or len(v)<6 else (len(v),v[:2],v[-2:])) for k,v in j.items()})
          fr=j.get('frames',[])
          worst=[]
          for f in fr:
            for pre in ('r_','z_'):
              try:
                a=np.asarray(Image.open(io.BytesIO(urllib.request.urlopen(B+pre+f+'.png').read())).convert('RGBA')).astype(int)
              except Exception as e:
                print(pre,f,'ERR',e); continue
              al=a[...,3]>30; dark=al&(a[...,:3].max(-1)<60)
              worst.append((int(dark.sum()),pre,f,int(al.sum())))
          worst.sort(reverse=True); print(worst[:15])
          for n,pre,f,_ in worst[:3]:
            open(f'w_{pre}{f}.png','wb').write(urllib.request.urlopen(B+pre+f+'.png').read())
          PY
          git init -q; git checkout -q -b probe-out-rd; git add *.txt *.png 2>/dev/null; git add *.txt; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-rd
