# One-off: what the test site lists.
name: probe-lat
on:
  push:
    paths: [".github/workflows/probe-lat.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir -p out
          curl -sL "https://test.odisha-wx-charts.pages.dev/index.json?x=$RANDOM" | python3 -c "
          import json,sys;d=json.load(sys.stdin)
          for m in d['models']:
              r=m['runs'][0];sp=list((r.get('states') or {}).get('odisha',{}).get('products',{}))
              print(m['model'],r['run'],'partial' if r.get('partial') else 'full',r.get('upto'),sp)" > out/log.txt
      - if: always()
        run: |
          cd out && git init -q -b probe-out-lat && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm lat
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-lat
