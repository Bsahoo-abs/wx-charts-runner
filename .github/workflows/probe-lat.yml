name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir o; cd o
          S=https://test.odisha-wx-charts-sat.pages.dev
          { date -u; curl -s $S/sat2/sat.json | python3 -c 'import sys,json;d=json.load(sys.stdin);print(d.get("look"),d["wide"],d["frames"][-3:],{k:len(v) for k,v in d.get("loops",{}).items()},d["made"])'; } > out.txt
          git init -q; git checkout -q -b probe-out-lat; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-lat
