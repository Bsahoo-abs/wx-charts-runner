# One-off: check old and new test addresses.
name: probe-lat
on:
  push:
    paths: [".github/workflows/probe-lat.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          mkdir -p out
          for u in https://test.odisha-wx-charts.pages.dev/ https://test.odisha-wx-charts.pages.dev/lab.html https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/ https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/index.json https://odisha-wx-charts.pages.dev/; do
            echo "$u $(curl -sL -o /tmp/b -w '%{http_code}' "$u") $(head -c 120 /tmp/b | tr '\n' ' ')" >> out/log.txt
          done
      - if: always()
        run: |
          cd out && git init -q -b probe-out-lat && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm p
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-lat
