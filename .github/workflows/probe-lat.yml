name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e; mkdir o; cd o; npm init -y >/dev/null; npm i playwright@1.48.2 >/dev/null 2>&1; npx playwright install chromium >/dev/null 2>&1
          cat > s.js <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch();const p=await b.newPage({viewport:{width:1440,height:900}});
          const B="https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev/";
          for(const [u,n,w] of [["",'index',6000],["lab.html",'lab',6000],["livemap.html#layer=wind",'wind',14000],["livemap.html#layer=gust",'gust',14000]]){
            try{await p.goto(B+u,{timeout:60000});await p.waitForTimeout(w);await p.screenshot({path:n+'.png'})}catch(e){console.log(n,e.message)}}
          await b.close()})();
          JS
          node s.js > log.txt 2>&1
          git init -q; git checkout -q -b probe-out-shot; git add *.png log.txt; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-shot
