name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e; mkdir o; cd o; B=https://test.odisha-wx-charts-glob.pages.dev/gfs
          curl -s -A Mozilla/5.0 $B/xs.json -o xs.json; curl -s -A Mozilla/5.0 $B/meta.json -o meta.json
          python3 -c "
          import json;j=json.load(open('xs.json'));print(' '.join('x%03d'%s['h'] for s in j['steps'] if '2026-11-02T00' <= s['valid'] <= '2026-11-03T12'))" > list.txt
          for x in $(cat list.txt); do curl -s -A Mozilla/5.0 $B/$x.webp -o $x.webp; f=$(echo $x|sed 's/x/f/'); curl -s -A Mozilla/5.0 $B/$f.webp -o $f.webp; done
          git init -q; git checkout -q -b probe-out-xs; git add -A; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-xs
