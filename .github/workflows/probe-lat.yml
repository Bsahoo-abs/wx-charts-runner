# One-off: save a copy of a reference weather website (for study; kept in the PRIVATE code repository).
name: probe-lat
on:
  push:
    paths: [".github/workflows/probe-lat.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grab:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - name: Save the site
        env:
          BASE: https://probe-lease-kerry-sept.trycloudflare.com
        run: |
          mkdir -p ref && cd ref
          npm init -y >/dev/null && npm i -s playwright@1.48.2 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > grab.js <<'JS'
          const { chromium } = require('playwright'); const fs = require('fs'), path = require('path');
          const BASE = process.env.BASE; const save = {}; const log = [];
          (async () => {
            const b = await chromium.launch({args:['--use-gl=swiftshader','--enable-webgl','--ignore-gpu-blocklist']});
            for (const [tag, vp, mob] of [['desk', {width:1440,height:900}, false], ['phone', {width:390,height:844}, true]]) {
              const ctx = await b.newContext({viewport: vp, isMobile: mob, hasTouch: mob, deviceScaleFactor: mob ? 2 : 1});
              const p = await ctx.newPage();
              p.on('console', m => log.push(`[${tag} console] ${m.type()} ${m.text()}`.slice(0,500)));
              p.on('response', async r => { const u = r.url(); log.push(`[${tag} net] ${r.status()} ${r.request().resourceType()} ${u}`.slice(0,400));
                try { if (u.startsWith(BASE) && !save[u]) { const buf = await r.body(); if (buf.length < 30e6) { save[u] = 1;
                  let f = path.join('site', new URL(u).pathname.replace(/\/$/, '/index.html')); if (new URL(u).search) f += '__' + new URL(u).search.replace(/[^a-z0-9]/gi,'_').slice(0,80);
                  fs.mkdirSync(path.dirname(f), {recursive:true}); fs.writeFileSync(f, buf); } } } catch (e) {} });
              for (const h of ['', '#model=gem&layer=wind']) {
                await p.goto(BASE + '/' + h, {waitUntil:'networkidle', timeout: 90000}).catch(e => log.push('goto '+e));
                await p.waitForTimeout(8000);
                const n = (h||'home').replace(/[^a-z0-9]/gi,'_');
                await p.screenshot({path:`shot_${tag}_${n}.png`, fullPage: true});
                fs.writeFileSync(`dom_${tag}_${n}.html`, await p.content());
                fs.writeFileSync(`text_${tag}_${n}.txt`, await p.evaluate(() => document.body.innerText));
                fs.writeFileSync(`controls_${tag}_${n}.json`, JSON.stringify(await p.evaluate(() =>
                  [...document.querySelectorAll('button,select,option,a,input,[role=button],[data-layer],[data-model]')].map(e => ({tag:e.tagName, id:e.id, cls:e.className && String(e.className).slice(0,80), text:(e.innerText||e.value||'').trim().slice(0,80), title:e.title, href:e.getAttribute('href'), data:{...e.dataset}}))), null, 1));
              }
              // click every visible button once (desktop), screenshot each state
              if (tag === 'desk') {
                const btns = await p.$$('button,[role=button]'); let k = 0;
                for (const bt of btns.slice(0, 80)) { try { if (!(await bt.isVisible())) continue; const t = ((await bt.innerText())||'').trim().slice(0,30).replace(/[^a-z0-9]/gi,'_') || 'b';
                  await bt.click({timeout: 3000}); await p.waitForTimeout(2500); await p.screenshot({path:`click_${String(k++).padStart(2,'0')}_${t}.png`}); } catch (e) {} }
              }
              await ctx.close();
            }
            fs.writeFileSync('network_and_console.txt', log.join('\n')); await b.close();
          })();
          JS
          node grab.js || true
          wget -q -e robots=off -r -l 3 -np -p -k -P mirror "$BASE/" || true
          ls -la; du -sh .
      - name: Keep it in the private code repository
        run: |
          cd ref && rm -rf node_modules package*.json
          git init -q -b ref-site && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "reference site copy"
          git push -q -f "https://x-access-token:${{ secrets.CODE_TOKEN }}@github.com/${{ vars.CODE_REPO }}.git" ref-site && echo "pushed to private repo"
