# One-off: demo data for the animated wind + rain map (not published). -> branch probe-out-wind
name: probe-lat
on:
  push:
    paths: [".github/workflows/probe-lat.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          pip install -q numpy pillow eccodes scipy
          python code/tools/demo_wind.py out 2>&1 | tee log.txt; cp log.txt out/
      - if: always()
        run: |
          mkdir -p out && cd out && git init -q -b probe-out-wind && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm wind
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-wind
