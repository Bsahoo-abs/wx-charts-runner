name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          set +e; mkdir o; cd o
          curl -s -A Mozilla/5.0 https://test.odisha-wx-charts-sat.pages.dev/tc/feed.json -o feed.json
          curl -s -A Mozilla/5.0 https://odisha-wx-charts-sat.pages.dev/tc/feed.json -o feed_main.json
          git init -q; git checkout -q -b probe-out-feed; git add -A; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-feed
