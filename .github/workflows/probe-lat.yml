name: probe-lat
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e; mkdir o; cd o; sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1
          g(){ n=$1; u=$2; code=$(curl -sL -A "Mozilla/5.0" -m 60 -o "$n" -w "%{http_code} %{size_download}" "$u"); echo "$n $code $u" >> out.txt; }
          g ucar_ni.html http://hurricanes.ral.ucar.edu/realtime/current/
          g ucar_root.html http://hurricanes.ral.ucar.edu/repository/data/adecks_open/
          g aio98.dat http://hurricanes.ral.ucar.edu/repository/data/adecks_open/aio982026.dat
          g aio98b.dat http://hurricanes.ral.ucar.edu/repository/data/adecks_open/2026/aio982026.dat
          g bio98.dat http://hurricanes.ral.ucar.edu/repository/data/bdecks_open/2026/bio982026.dat
          g io98web.txt https://www.metoc.navy.mil/jtwc/products/io9826web.txt
          g io98.tcw https://www.metoc.navy.mil/jtwc/products/io9826.tcw
          g jtwc.rss https://www.metoc.navy.mil/jtwc/rss/jtwc.rss
          g rsmc.html https://rsmcnewdelhi.imd.gov.in/
          a=$(grep -oE 'uploads/archive/[^"]*TC_ADVISORY[^"]*\.pdf' rsmc.html | head -1); g adv.pdf "https://rsmcnewdelhi.imd.gov.in/$a"; pdftotext -layout adv.pdf adv.txt
          a=$(grep -oE 'uploads/archive/[^"]*QUADRANT[^"]*\.pdf' rsmc.html | head -1); g quad.pdf "https://rsmcnewdelhi.imd.gov.in/$a"; pdftotext -layout quad.pdf quad.txt
          a=$(grep -oE 'uploads/archive/[^"]*National_Bulletin[^"]*\.pdf' rsmc.html | head -1); g nat.pdf "https://rsmcnewdelhi.imd.gov.in/$a"; pdftotext -layout nat.pdf nat.txt
          g rammb.html "https://rammb-data.cira.colostate.edu/tc_realtime/"
          grep -oE 'href="[^"]*"' ucar_ni.html | grep -i "io\|indian\|adeck\|\.dat" | head -30 > ucarlinks.txt
          grep -oE 'href="[^"]*"' ucar_root.html | tail -30 >> ucarlinks.txt
          grep -oE 'href="[^"]*"' rammb.html | grep -i "io\|storm" | head -30 > rammblinks.txt
          rm -f *.pdf mausam.html
          git init -q; git checkout -q -b probe-out-tc2; git add .; git -c user.name=p -c user.email=p@p commit -qm p
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out-tc2
