# One-off TEST: is the radar page reachable? Results -> branch probe-out-lat.
name: probe-lat
on:
  push:
    paths: [".github/workflows/probe-lat.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p out
          npx --yes wrangler@3 pages project list 2>&1 | grep -i "radar\|Project Name\|odisha" | sed 's/[^[:print:]]//g' >> out/log.txt || true
          npx --yes wrangler@3 pages deployment list --project-name odisha-wx-charts-radar 2>&1 | head -12 >> out/log.txt || true
          for u in https://test.odisha-wx-charts-radar.pages.dev/ https://odisha-wx-charts-radar.pages.dev/; do curl -sS -o /dev/null -w "$u %{http_code}\n" "$u" >> out/log.txt 2>&1 || true; done
          for u in https://test.odisha-wx-charts-radar.pages.dev/radar/radar.json https://odisha-wx-charts-radar.pages.dev/radar/radar.json; do
            echo "== $u" >> out/log.txt; curl -s -D - -o out/body.txt "$u" | head -20 >> out/log.txt; head -c 400 out/body.txt >> out/log.txt; echo >> out/log.txt
          done
          curl -sL https://test.odisha-wx-charts.pages.dev/lab.html | grep -c "m-radar\|RADAR_BASE" >> out/log.txt || true
          curl -s -o /dev/null -w "radar3d %{http_code}\n" https://test.odisha-wx-charts.pages.dev/radar3d.html >> out/log.txt
      - name: Save
        if: always()
        run: |
          cd out && git init -q -b probe-out-lat && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm lat
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-lat
