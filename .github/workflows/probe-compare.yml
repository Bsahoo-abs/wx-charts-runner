# One-off TEST (not the website): run-to-run comparison demo. Results -> branch probe-out-compare.
name: probe-compare

on:
  push:
    paths: [".github/workflows/probe-compare.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - uses: actions/cache/restore@v4
        with:
          path: site/ECMWF
          key: ptest-ECMWF-none
          restore-keys: ptest-ECMWF-
      - uses: actions/cache/restore@v4
        with:
          path: site/AIFS
          key: ptest-AIFS-none
          restore-keys: ptest-AIFS-
      - uses: actions/cache/restore@v4
        with:
          path: site/GFS
          key: ptest-GFS-none
          restore-keys: ptest-GFS-
      - uses: actions/cache/restore@v4
        with:
          path: site/AIGFS
          key: ptest-AIGFS-none
          restore-keys: ptest-AIGFS-
      - uses: actions/cache/restore@v4
        with:
          path: site/ICON
          key: ptest-ICON-none
          restore-keys: ptest-ICON-
      - uses: actions/cache/restore@v4
        with:
          path: site/GEM
          key: ptest-GEM-none
          restore-keys: ptest-GEM-
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Pressure check
        env:
          MPLBACKEND: Agg
        run: |
          pip install -q -r code/requirements.txt
          mkdir -p out
          cd code
          for mr in AIGFS:2026102006 AIGFS:2026102012 ECMWF:2026102000; do
            echo "=== $mr" >> ../out/log.txt
            python tools/probe_pressure.py ${mr%%:*} ${mr##*:} ../site ../work 2>&1 | grep -v "steps\|looking\|memory\|Warning" >> ../out/log.txt || true
          done
      - name: Save
        if: always()
        run: |
          mkdir -p out && cd out
          git init -q -b probe-out-compare && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm compare
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-compare
