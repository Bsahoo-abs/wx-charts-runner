# One-off TEST (not the website): run-to-run comparison demo. Results -> branch probe-out-compare.
name: probe-compare

on:
  push:
    paths: [".github/workflows/probe-compare.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - uses: actions/cache/restore@v4
        with:
          path: site/ECMWF
          key: ptest-ECMWF-none
          restore-keys: ptest-ECMWF-
      - uses: actions/cache/restore@v4
        with:
          path: site/AIFS
          key: ptest-AIFS-none
          restore-keys: ptest-AIFS-
      - uses: actions/cache/restore@v4
        with:
          path: site/GFS
          key: ptest-GFS-none
          restore-keys: ptest-GFS-
      - uses: actions/cache/restore@v4
        with:
          path: site/AIGFS
          key: ptest-AIGFS-none
          restore-keys: ptest-AIGFS-
      - uses: actions/cache/restore@v4
        with:
          path: site/ICON
          key: ptest-ICON-none
          restore-keys: ptest-ICON-
      - uses: actions/cache/restore@v4
        with:
          path: site/GEM
          key: ptest-GEM-none
          restore-keys: ptest-GEM-
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Demo
        env:
          MPLBACKEND: Agg
        run: |
          pip install -q numpy matplotlib cartopy "shapely>=2"
          mkdir -p out && ls site/*/ > out/runs.txt 2>&1
          python3 - <<'PY' 2>&1 | tee out/log.txt
          import json, glob
          for f in sorted(glob.glob("site/*/*/tracks.json")):
              js = json.load(open(f))
              for k, s in enumerate(js["systems"]):
                  pts = s["pts"]
                  lo = min(pts, key=lambda p: p[3])
                  print(f, "system", k, "min", lo[3], "hPa at +", lo[0], "h", round(lo[1], 1), "E", round(lo[2], 1), "N", "npts", len(pts))
          PY
          ls -la --time-style=+%H:%M site/*/*/tracks.json >> out/log.txt
      - name: Save
        if: always()
        run: |
          mkdir -p out && cd out
          git init -q -b probe-out-compare && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm compare
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-compare
