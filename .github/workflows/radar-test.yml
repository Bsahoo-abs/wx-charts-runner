# IMD radar mosaic (testing) every 10 minutes, published on its own small Cloudflare Pages project
# (<PAGES_PROJECT>-radar), so it never waits for, or holds up, the chart / satellite publishing.
name: radar-test

on:
  schedule:
    - cron: "*/10 * * * *"
  push:
    paths: [".github/workflows/radar-test.yml"]
  workflow_dispatch:

concurrency:
  group: radar-test
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - uses: actions/cache/restore@v4
        with:
          path: pub/radar
          key: radt-none
          restore-keys: radt-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/radarx/requirements.txt
      - name: Read the IMD radar pictures
        run: |
          pip install -q -r code/radarx/requirements.txt
          python code/cloud_radar.py pub
          echo "::notice title=radar::$(du -sh pub | cut -f1), $(ls pub/radar | wc -l) files"
      - uses: actions/cache/save@v4
        with:
          path: pub/radar
          key: radt-${{ github.run_id }}
      - name: Delete older saved sets
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: radt-${{ github.run_id }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "radt-" --limit 100 --json key -q '.[].key' |
            while read -r k; do [ "$k" != "$NEW" ] && gh cache delete -R "$GITHUB_REPOSITORY" "$k" || true; done
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT }}-radar
        run: |
          npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy pub --project-name "$PROJECT" --branch test --commit-dirty=true
