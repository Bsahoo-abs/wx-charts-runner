# IMD radar mosaic (testing), a new picture every 10 minutes, published on its own small Cloudflare Pages project
# (<PAGES_PROJECT>-radar), so it never waits for, or holds up, the chart / satellite publishing.
# GitHub's timer is unreliable for every-10-minutes, so each run (twice an hour) keeps going for ~27 minutes and
# updates every 10 minutes itself.
name: radar-test

on:
  schedule:
    - cron: "4,34 * * * *"
  push:
    paths: [".github/workflows/radar-test.yml"]
  workflow_dispatch:

concurrency:
  group: radar-test
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  radar:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - uses: actions/cache/restore@v4
        with:
          path: pub/radar
          key: radt-none
          restore-keys: radt-
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/radarx/requirements.txt
      - run: pip install -q -r code/radarx/requirements.txt && npm i -g -s wrangler@3 >/dev/null 2>&1
      - name: Radar every 10 minutes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT }}-radar
        run: |
          start=$(date +%s)
          while :; do
            python code/cloud_radar.py pub || echo "::warning title=radar::reading failed this time"
            wrangler pages deploy pub --project-name "$PROJECT" --branch test --commit-dirty=true >/dev/null 2>&1               || wrangler pages deploy pub --project-name "$PROJECT" --branch test --commit-dirty=true
            now=$(date +%s); [ $((now - start)) -gt 1500 ] && break
            sleep $(( 600 - $(date +%s) % 600 + 60 ))      # next 10-minute mark + 1 min (IMD's new scans are up by then)
            [ $(( $(date +%s) - start )) -gt 1680 ] && break
          done
          echo "::notice title=radar::$(du -sh pub | cut -f1), $(ls pub/radar | wc -l) files"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pub/radar
          key: radt-${{ github.run_id }}
      - name: Delete older saved sets
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: radt-${{ github.run_id }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "radt-" --limit 100 --json key -q '.[].key' |
            while read -r k; do [ "$k" != "$NEW" ] && gh cache delete -R "$GITHUB_REPOSITORY" "$k" || true; done
