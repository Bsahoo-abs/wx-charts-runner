# charts-test: TEST of progressive runs + only-when-new-data
# Every 30 minutes: for each model, make the PNG charts + GIFs of its newest complete run (if not made yet), then publish
# the whole website to Cloudflare Pages. The code itself lives in your PRIVATE repository. (models: GFS, AIGFS,
# ECMWF, AIFS, ICON, GEM; ensembles: GEFS, AIGEFS, ECMWF ENS, AIFS ENS)
#   secrets   CODE_TOKEN, CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variables CODE_REPO (yourname/wx-charts-code), PAGES_PROJECT (odisha-wx-charts)
name: charts-test

on:
  schedule:
    - cron: "*/10 * * * *"
  push:                              # also runs when this file is changed
    paths: [".github/workflows/charts-test.yml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Make the newest runs again even if already published"
        type: boolean
        default: false

concurrency:
  group: charts-test
  cancel-in-progress: false

permissions:
  contents: read
  actions: write                     # to delete old saved sets (keeps the cache small)

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      models: ${{ steps.plan.outputs.models }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          path: code
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install
        run: pip install -q -r code/requirements.txt
      - name: Which models have new data?
        id: plan
        env:
          MPLBACKEND: Agg
        run: |
          cd code
          python cloud_plan.py --site-url "https://test.${{ vars.PAGES_PROJECT }}.pages.dev" \
            --models ECMWF,AIFS,GFS,AIGFS,ICON,GEM ${{ inputs.force && '--force' || '' }}

  make:
    needs: plan
    if: needs.plan.outputs.models != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    steps:
      - name: Get the code (private repository)
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          path: code

      - name: Restore this model's published files
        uses: actions/cache/restore@v4
        with:
          path: site/${{ matrix.model }}
          key: ptest-${{ matrix.model }}-none
          restore-keys: ptest-${{ matrix.model }}-

      - name: Map data cache (coastlines, borders)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install
        run: |
          pip install -q -r code/requirements.txt
          python -c "import cartopy, eccodes; print('eccodes', eccodes.codes_get_api_version())"   # cartopy FIRST

      - name: Make the charts
        id: run
        env:
          MPLBACKEND: Agg
        run: |
          cd code
          python cloud_run.py --progressive --model ${{ matrix.model }} --site ../site --work ../work \
            ${{ inputs.force && '--force' || '' }} 2>&1 | tee ../run.log

      - name: Show problems in the run summary
        if: always()
        run: |
          python3 - <<'PY'
          import re
          try:
              lines = open("run.log", encoding="utf-8", errors="replace").read().splitlines()
          except FileNotFoundError:
              raise SystemExit
          key = re.compile(r"fail|error|traceback|skipp|missing|warning|not on the server|complete to|finished at|"
                           r"steps to download|done \(|charts on|pictures|videos|MB|nothing to do|exception|  File ", re.I)
          pick = [l for l in lines if key.search(l) and "piece" not in l] + ["--- last lines ---"] + lines[-25:]
          for i in range(0, min(len(pick), 400), 40):
              msg = "%0A".join(x.replace("%", "%25")[:300] for x in pick[i:i + 40])
              print(f"::warning title=${{ matrix.model }} log {i // 40 + 1}::{msg}")
          PY

      - name: Save this model's files
        if: steps.run.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: site/${{ matrix.model }}
          key: ptest-${{ matrix.model }}-${{ steps.run.outputs.run }}-${{ github.run_id }}

      - name: Delete older saved sets of this model
        if: steps.run.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: ptest-${{ matrix.model }}-${{ steps.run.outputs.run }}-${{ github.run_id }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "ptest-${{ matrix.model }}-" --limit 100 --json key -q '.[].key' |
            while read -r k; do [ "$k" != "$NEW" ] && gh cache delete -R "$GITHUB_REPOSITORY" "$k" || true; done

      - name: Mark as updated
        if: steps.run.outputs.updated == 'true'
        run: echo "${{ steps.run.outputs.run }}" > updated.txt

      - uses: actions/upload-artifact@v4
        if: steps.run.outputs.updated == 'true'
        with:
          name: updated-${{ matrix.model }}
          path: updated.txt
          retention-days: 1

  publish:
    needs: [plan, make]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:                     # one publish at a time across charts / videos / ensembles
      group: publish-test
      cancel-in-progress: false
    steps:
      - name: Anything new?
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: updated-*
          path: updated

      - name: Check
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || { [ -d updated ] && [ -n "$(ls -A updated 2>/dev/null)" ]; }; then
            echo "any=true" >> "$GITHUB_OUTPUT"; echo "new: $(ls updated | tr '\n' ' ')"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"; echo "nothing new - nothing to publish"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.any == 'true'
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          path: code
      - { name: 'ptest ECMWF', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/ECMWF, key: ptest-ECMWF-none, restore-keys: ptest-ECMWF- } }
      - { name: 'ptest AIFS', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/AIFS, key: ptest-AIFS-none, restore-keys: ptest-AIFS- } }
      - { name: 'ptest GFS', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/GFS, key: ptest-GFS-none, restore-keys: ptest-GFS- } }
      - { name: 'ptest AIGFS', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/AIGFS, key: ptest-AIGFS-none, restore-keys: ptest-AIGFS- } }
      - { name: 'ptest ICON', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/ICON, key: ptest-ICON-none, restore-keys: ptest-ICON- } }
      - { name: 'ptest GEM', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/GEM, key: ptest-GEM-none, restore-keys: ptest-GEM- } }
      - { name: 'vid ECMWF', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/vid/ECMWF, key: vid-ECMWF-none, restore-keys: vid-ECMWF- } }
      - { name: 'vid AIFS', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/vid/AIFS, key: vid-AIFS-none, restore-keys: vid-AIFS- } }
      - { name: 'vid GFS', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/vid/GFS, key: vid-GFS-none, restore-keys: vid-GFS- } }
      - { name: 'vid AIGFS', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/vid/AIGFS, key: vid-AIGFS-none, restore-keys: vid-AIGFS- } }
      - { name: 'vid ICON', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/vid/ICON, key: vid-ICON-none, restore-keys: vid-ICON- } }
      - { name: 'vid GEM', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/vid/GEM, key: vid-GEM-none, restore-keys: vid-GEM- } }
      - { name: 'ens ECMWF_ENS', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/ens/ECMWF_ENS, key: ens-ECMWF_ENS-none, restore-keys: ens-ECMWF_ENS- } }
      - { name: 'ens AIFS_ENS', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/ens/AIFS_ENS, key: ens-AIFS_ENS-none, restore-keys: ens-AIFS_ENS- } }
      - { name: 'ens GEFS', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/ens/GEFS, key: ens-GEFS-none, restore-keys: ens-GEFS- } }
      - { name: 'ens AIGEFS', if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/ens/AIGEFS, key: ens-AIGEFS-none, restore-keys: ens-AIGEFS- } }

      - uses: actions/setup-python@v6
        if: steps.check.outputs.any == 'true'
        with:
          python-version: "3.11"

      - name: Map data cache (coastlines, borders)
        if: steps.check.outputs.any == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1

      - name: Model guidance (all models' cyclone tracks)
        if: steps.check.outputs.any == 'true'
        continue-on-error: true
        env:
          MPLBACKEND: Agg
        run: |
          pip install -q numpy matplotlib cartopy "shapely>=2" reportlab pillow
          python code/cloud_guidance.py site

      - name: Build the website
        if: steps.check.outputs.any == 'true'
        run: python3 code/site_build.py site

      - name: Publish to Cloudflare Pages
        if: steps.check.outputs.any == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
                    npx --yes wrangler@3 pages deploy site --project-name "$PROJECT" --branch test --commit-dirty=true
