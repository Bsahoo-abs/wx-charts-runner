# Satellite tab pictures (GK-2A, NOAA open data) for the test site, on their own small Cloudflare Pages project
# (<PAGES_PROJECT>-sattab) and their own runner, so they never slow the live-map satellite job.
# Each run keeps going ~55 min, makes the newest scan as soon as NOAA has it, and publishes; runs start twice an hour.
name: sattab-test

on:
  schedule:
    - cron: "17,47 * * * *"
  push:
    paths: [".github/workflows/sattab-test.yml"]
  workflow_dispatch:

concurrency:
  group: sattab-test
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  sat:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - uses: actions/cache/restore@v4
        with:
          path: site/sat
          key: satt-IODC-none
          restore-keys: satt-IODC-
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/cloud_sat.py
      - run: |
          pip install -q numpy scipy pillow cartopy "shapely>=2" "satpy[ami_l1b]" opencv-python-headless pyspectral pyresample netCDF4 h5netcdf dask
          npm i -g -s wrangler@3 >/dev/null 2>&1
      - name: Satellite tab pictures, as soon as each scan arrives
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT }}-sattab
        run: |
          wrangler pages project create "$PROJECT" --production-branch main >/dev/null 2>&1 || true
          mkdir -p pub/sat
          printf '/*\n  Access-Control-Allow-Origin: *\n  X-Robots-Tag: noindex\n/sat/*.json\n  Cache-Control: no-cache\n/sat/*\n  Cache-Control: public, max-age=86400\n' > pub/_headers
          publish() {
            rsync -a --delete site/sat/ pub/sat/
            wrangler pages deploy pub --project-name "$PROJECT" --branch test --commit-dirty=true >/dev/null 2>&1 \
              || wrangler pages deploy pub --project-name "$PROJECT" --branch test --commit-dirty=true \
              || echo "::warning title=satellite tab::upload failed, the next pass tries again"
          }
          [ -f site/sat/sat.json ] && publish
          start=$(date +%s); n=0; last=""
          while :; do
            n=$((n+1)); mb=-1; [ $((n % 4)) -eq 0 ] && mb=420           # Meteosat-only pictures (slow) every 4th pass
            ( cd code && SAT_BUDGET=300 SAT_MSG_BUDGET=$mb SAT_FY_BUDGET=90 python cloud_sat.py ../site > ../pass.log 2>&1 ) \
              || { echo "::warning title=satellite tab::pass $n failed"; tail -4 pass.log; }
            newest=$(python3 -c "import json;print(max(json.load(open('site/sat/sat.json'))['products']['clouds']['frames']))" 2>/dev/null || echo "")
            echo "pass $n: newest $newest; $(grep -h 'ok in' pass.log | tr '\n' ' ' | cut -c1-200)"
            [ -n "$newest" ] && [ "$newest" != "$last" -o $((n % 4)) -eq 0 ] && { publish; last=$newest; }
            [ $(( $(date +%s) - start )) -gt 3150 ] && break
            sleep 60
          done
          echo "::notice title=satellite tab::newest $last after $n passes"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: site/sat
          key: satt-IODC-${{ github.run_id }}
