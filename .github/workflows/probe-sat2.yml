# One-off TEST (not the website): GK2A samples on the map grid. Results -> branch probe-out-3dnio.
name: probe-sat2

on:
  push:
    paths: [".github/workflows/probe-sat2.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - run: pip install -q numpy pillow "satpy[ami_l1b]" pyresample pyorbital pyspectral netCDF4 h5netcdf dask
      - run: mkdir -p out && python3 code/tools/probe_3d_nio.py out 2>&1 | tee out/log.txt; exit ${PIPESTATUS[0]}
      - name: Save
        if: always()
        run: |
          mkdir -p out && cd out
          git init -q -b probe-out-3dnio && git add -A
          git -c user.name=probe -c user.email=probe@users.noreply.github.com commit -qm "gk2a probe"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe-out-3dnio
