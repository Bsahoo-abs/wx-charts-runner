# Sharp satellite pictures for the live map (testing), every 10 minutes, and the cyclone analysis feed (IMD, JTWC,
# models) for the track maker, on their own small Cloudflare Pages project (<PAGES_PROJECT>-sat) like the radar.
# Each run keeps going for ~55 minutes and checks for a new GK-2A scan every 2.5 minutes; runs start twice an hour,
# so the next one is always waiting (GitHub's timer is often late) and there is no gap between them.
name: sat2-test

on:
  schedule:
    - cron: "2,32 * * * *"
  push:
    paths: [".github/workflows/sat2-test.yml"]
  workflow_dispatch:

concurrency:
  group: sat2-test
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  sat:
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 66
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: test
          path: code
      - uses: actions/cache/restore@v4
        with:
          path: pub
          key: s2t-none
          restore-keys: s2t-
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          for i in 1 2 3; do pip install -q numpy scipy pillow cartopy "shapely>=2" "satpy[ami_l1b]" pyspectral pyresample netCDF4 h5netcdf dask opencv-python-headless pdfplumber && break; echo "install failed, trying again"; sleep 20; done
          for i in 1 2 3; do npm i -g -s wrangler@3 >/dev/null 2>&1 && break; sleep 20; done
      - name: Satellite every 10 minutes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT }}-sat
          TRACK_PASSCODE: ${{ secrets.TRACK_PASSCODE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          cd code
          mkdir -p ../pub
          printf '/*\n  Access-Control-Allow-Origin: *\n/sat2/sat.json\n  Cache-Control: no-cache\n/tc/*\n  Cache-Control: no-cache\n/obs/*\n  Cache-Control: max-age=60\n/sat2/*\n  Cache-Control: public, max-age=86400\n' > ../pub/_headers
          TRACK_PASSCODE="$TRACK_PASSCODE" python tools/cf_setup.py "$PROJECT" || true
          python cloud_tcfeed.py ../pub https://ow-5k4kr1ny9f.odisha-wx-charts.pages.dev > ../tc.log 2>&1 || true
          python cloud_tcworld.py ../pub >> ../tc.log 2>&1 || true
          tail -3 ../tc.log
          start=$(date +%s); obs=0; city=0; first=1
          while :; do
            # weather stations: every 10 minutes (airports report each hour, weather stations every 3 hours)
            if [ $(( $(date +%s) - obs )) -ge 590 ]; then
              obs=$(date +%s)
              [ -f ../obs.log ] && grep "^obs" ../obs.log | tail -8
              # runs alongside the satellite, so neither waits for the other; its files go up with the next upload
              (OBS_SYNOP_H=$([ $first = 1 ] && echo 222 || echo 30) timeout 540 python cloud_obs.py ../pub https://test.odisha-wx-charts-sat.pages.dev > ../obs.log 2>&1 || echo "obs: failed this time" >> ../obs.log; timeout 120 python cloud_winds.py ../pub https://test.odisha-wx-charts-sat.pages.dev >> ../obs.log 2>&1 || echo "winds: failed this time" >> ../obs.log) &
              first=0
            fi
            # IMD district stations (IMD city weather): every 30 minutes
            if [ $(( $(date +%s) - city )) -ge 1790 ]; then
              city=$(date +%s)
              [ -f ../city.log ] && tail -2 ../city.log
              (timeout 900 python cloud_imdcity.py ../pub https://test.odisha-wx-charts-sat.pages.dev > ../city.log 2>&1 || echo "imdcity: failed this time" >> ../city.log) &
            fi
            python cloud_sat2.py ../pub 480 || echo "::warning title=sat2::failed this time"
            (cd pages_sat && { wrangler pages deploy ../../pub --project-name "$PROJECT" --branch test --commit-dirty=true >/dev/null 2>&1 \
              || wrangler pages deploy ../../pub --project-name "$PROJECT" --branch test --commit-dirty=true; }) || echo "::warning title=sat2::upload failed, next pass tries again"
            [ $(( $(date +%s) - start )) -gt 3150 ] && break
            # GitHub's own timer is often hours late: near the end, line up the next run ourselves
            if [ -z "$chained" ] && [ $(( $(date +%s) - start )) -gt 2700 ]; then chained=1; gh workflow run sat2-test.yml -R "$GITHUB_REPOSITORY" --ref main || true; fi
            sleep 150
          done
          echo "::notice title=sat2::$(du -sh ../pub | cut -f1), $(ls ../pub/sat2/h | wc -l) pictures, newest $(ls ../pub/sat2/h | tail -1)"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: pub
          key: s2t-${{ github.run_id }}
      - name: Delete older saved sets
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: s2t-${{ github.run_id }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "s2t-" --limit 100 --json key -q '.[].key' |
            while read -r k; do [ "$k" != "$NEW" ] && gh cache delete -R "$GITHUB_REPOSITORY" "$k" || true; done
