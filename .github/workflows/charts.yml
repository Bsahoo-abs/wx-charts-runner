# Every 2 hours: for each model, make the PNG charts + GIFs of its newest complete run (if not made yet),
# then publish everything to Cloudflare Pages. The chart code itself lives in your PRIVATE repository.
#
# Needs (Settings -> Secrets and variables -> Actions):
#   secrets   CODE_TOKEN              GitHub token that can READ the private code repository
#             CLOUDFLARE_API_TOKEN    Cloudflare token with "Cloudflare Pages: Edit"
#             CLOUDFLARE_ACCOUNT_ID   your Cloudflare account ID
#   variables CODE_REPO               e.g. yourname/wx-charts-code
#             PAGES_PROJECT           e.g. odisha-wx-charts  (becomes https://odisha-wx-charts.pages.dev)
name: charts

on:
  schedule:
    - cron: "7 */2 * * *"            # every 2 hours (UTC); GitHub may start a few minutes late
  push:                              # also runs when this schedule file is changed
    paths: [".github/workflows/charts.yml"]
  workflow_dispatch:                 # "Run workflow" button
    inputs:
      force:
        description: "Make the newest runs again even if already published"
        type: boolean
        default: false

concurrency:
  group: charts
  cancel-in-progress: false

permissions:
  contents: read
  actions: write                     # to delete old saved chart sets (keeps the cache small)

jobs:
  charts:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false               # one model failing does not stop the others
      matrix:
        model: [ECMWF, AIFS, GFS, AIGFS]
    steps:
      - name: Get the chart code (private repository)
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          path: code

      - name: Restore this model's published charts
        uses: actions/cache/restore@v4
        with:
          path: site/${{ matrix.model }}
          key: site-${{ matrix.model }}-none
          restore-keys: site-${{ matrix.model }}-

      - name: Map data cache (coastlines, borders)
        uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - name: Install
        run: |
          pip install -q -r code/requirements.txt
          python -c "import cartopy, eccodes; print('eccodes', eccodes.codes_get_api_version())"   # cartopy FIRST (other order crashes)

      - name: Make the charts
        id: run
        env:
          MPLBACKEND: Agg
        run: |
          python code/cloud_run.py --model ${{ matrix.model }} --site site --work work \
            ${{ inputs.force && '--force' || '' }}

      - name: Save this model's charts
        if: steps.run.outputs.updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: site/${{ matrix.model }}
          key: site-${{ matrix.model }}-${{ steps.run.outputs.run }}-${{ github.run_id }}

      - name: Delete older saved sets of this model
        if: steps.run.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: site-${{ matrix.model }}-${{ steps.run.outputs.run }}-${{ github.run_id }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "site-${{ matrix.model }}-" --limit 100 --json key -q '.[].key' |
            while read -r k; do [ "$k" != "$NEW" ] && gh cache delete -R "$GITHUB_REPOSITORY" "$k" || true; done

      - name: Mark as updated
        if: steps.run.outputs.updated == 'true'
        run: echo "${{ steps.run.outputs.run }}" > updated.txt

      - uses: actions/upload-artifact@v4
        if: steps.run.outputs.updated == 'true'
        with:
          name: updated-${{ matrix.model }}
          path: updated.txt
          retention-days: 1

  publish:
    needs: charts
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Anything new?
        id: new
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: updated-*
          path: updated

      - name: Check
        id: check
        run: |
          if [ -d updated ] && [ -n "$(ls -A updated 2>/dev/null)" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"; echo "new: $(ls updated | tr '\n' ' ')"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"; echo "no new run - nothing to publish"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.any == 'true'
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          path: code

      - { name: ECMWF, if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/ECMWF, key: site-ECMWF-none, restore-keys: site-ECMWF- } }
      - { name: AIFS, if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/AIFS, key: site-AIFS-none, restore-keys: site-AIFS- } }
      - { name: GFS, if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/GFS, key: site-GFS-none, restore-keys: site-GFS- } }
      - { name: AIGFS, if: steps.check.outputs.any == 'true', uses: actions/cache/restore@v4,
          with: { path: site/AIGFS, key: site-AIGFS-none, restore-keys: site-AIGFS- } }

      - name: Build the website
        if: steps.check.outputs.any == 'true'
        run: python3 code/site_build.py site

      - name: Publish to Cloudflare Pages
        if: steps.check.outputs.any == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT }}
        run: |
          npx --yes wrangler@3 pages project create "$PROJECT" --production-branch main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true
