# Build and publish ONE model (started by the watcher). A run still coming in is shown up to the hours
# already out; each time more hours arrive only the new ones are drawn.
name: build

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Model"
        required: true
        type: choice
        options: [ECMWF, AIFS, GFS, AIGFS, ICON, GEM]

concurrency:
  group: build-${{ inputs.model }}     # one build per model at a time; a newer request waits
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      updated: ${{ steps.run.outputs.updated }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: main
          path: code
      - uses: actions/cache/restore@v4
        with:
          path: site/${{ inputs.model }}
          key: site-${{ inputs.model }}-none
          restore-keys: site-${{ inputs.model }}-
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install
        run: |
          pip install -q -r code/requirements.txt
          python -c "import cartopy, eccodes"
      - name: Make ${{ inputs.model }}
        id: run
        env:
          MPLBACKEND: Agg
        run: |
          cd code
          python cloud_run.py --progressive --model ${{ inputs.model }} --site ../site --work ../work 2>&1 | tee ../run.log
      - name: Show the log
        if: always()
        run: |
          python3 - <<'PY'
          try:
              lines = open("run.log", encoding="utf-8", errors="replace").read().splitlines()
          except FileNotFoundError:
              raise SystemExit
          pick = [l for l in lines if "piece" not in l][-60:]
          for i in range(0, len(pick), 30):
              msg = "%0A".join(x.replace("%", "%25")[:300] for x in pick[i:i + 30])
              print(f"::warning title=log {i // 30 + 1}::{msg}")
          PY
      - uses: actions/cache/save@v4
        if: steps.run.outputs.updated == 'true'
        with:
          path: site/${{ inputs.model }}
          key: site-${{ inputs.model }}-${{ steps.run.outputs.run }}-${{ github.run_id }}
      - name: Delete older saved sets of this model
        if: steps.run.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW: site-${{ inputs.model }}-${{ steps.run.outputs.run }}-${{ github.run_id }}
        run: |
          gh cache list -R "$GITHUB_REPOSITORY" --key "site-${{ inputs.model }}-" --limit 100 --json key -q '.[].key' |
            while read -r k; do [ "$k" != "$NEW" ] && gh cache delete -R "$GITHUB_REPOSITORY" "$k" || true; done

  publish:
    needs: make
    if: needs.make.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ vars.CODE_REPO }}
          token: ${{ secrets.CODE_TOKEN }}
          ref: main
          path: code
      - { name: 'site ECMWF', uses: actions/cache/restore@v4,
          with: { path: site/ECMWF, key: site-ECMWF-none, restore-keys: site-ECMWF- } }
      - { name: 'site AIFS', uses: actions/cache/restore@v4,
          with: { path: site/AIFS, key: site-AIFS-none, restore-keys: site-AIFS- } }
      - { name: 'site GFS', uses: actions/cache/restore@v4,
          with: { path: site/GFS, key: site-GFS-none, restore-keys: site-GFS- } }
      - { name: 'site AIGFS', uses: actions/cache/restore@v4,
          with: { path: site/AIGFS, key: site-AIGFS-none, restore-keys: site-AIGFS- } }
      - { name: 'site ICON', uses: actions/cache/restore@v4,
          with: { path: site/ICON, key: site-ICON-none, restore-keys: site-ICON- } }
      - { name: 'site GEM', uses: actions/cache/restore@v4,
          with: { path: site/GEM, key: site-GEM-none, restore-keys: site-GEM- } }
      - { name: 'vid ECMWF', uses: actions/cache/restore@v4,
          with: { path: site/vid/ECMWF, key: vid-ECMWF-none, restore-keys: vid-ECMWF- } }
      - { name: 'vid AIFS', uses: actions/cache/restore@v4,
          with: { path: site/vid/AIFS, key: vid-AIFS-none, restore-keys: vid-AIFS- } }
      - { name: 'vid GFS', uses: actions/cache/restore@v4,
          with: { path: site/vid/GFS, key: vid-GFS-none, restore-keys: vid-GFS- } }
      - { name: 'vid AIGFS', uses: actions/cache/restore@v4,
          with: { path: site/vid/AIGFS, key: vid-AIGFS-none, restore-keys: vid-AIGFS- } }
      - { name: 'vid ICON', uses: actions/cache/restore@v4,
          with: { path: site/vid/ICON, key: vid-ICON-none, restore-keys: vid-ICON- } }
      - { name: 'vid GEM', uses: actions/cache/restore@v4,
          with: { path: site/vid/GEM, key: vid-GEM-none, restore-keys: vid-GEM- } }
      - { name: 'ens ECMWF_ENS', uses: actions/cache/restore@v4,
          with: { path: site/ens/ECMWF_ENS, key: ens-ECMWF_ENS-none, restore-keys: ens-ECMWF_ENS- } }
      - { name: 'ens AIFS_ENS', uses: actions/cache/restore@v4,
          with: { path: site/ens/AIFS_ENS, key: ens-AIFS_ENS-none, restore-keys: ens-AIFS_ENS- } }
      - { name: 'ens GEFS', uses: actions/cache/restore@v4,
          with: { path: site/ens/GEFS, key: ens-GEFS-none, restore-keys: ens-GEFS- } }
      - { name: 'ens AIGEFS', uses: actions/cache/restore@v4,
          with: { path: site/ens/AIGEFS, key: ens-AIGEFS-none, restore-keys: ens-AIGEFS- } }
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-v1
      - name: Model guidance
        continue-on-error: true
        env:
          MPLBACKEND: Agg
        run: |
          pip install -q numpy matplotlib cartopy "shapely>=2" reportlab pillow
          python code/cloud_guidance.py site
      - name: Build the website
        run: python3 code/site_build.py site
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.PAGES_PROJECT }}
        run: npx --yes wrangler@3 pages deploy site --project-name "$PROJECT" --branch main --commit-dirty=true
